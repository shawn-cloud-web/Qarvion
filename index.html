<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qarvion | Digital Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        html {
            scroll-behavior: smooth;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -50px) rotate(5deg); }
            66% { transform: translate(-20px, 20px) rotate(-5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        
        @keyframes float-slow {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, -40px); }
        }

        @keyframes floatOrb {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
            50% { transform: translateY(-20px) scale(1.05); opacity: 0.7; }
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: scale(1) translateX(-50%); }
            50% { opacity: 0.8; transform: scale(1.1) translateX(-45%); }
        }

        @keyframes scrollLogos {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes scrollFast {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes circleFloat {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(15px, -15px); }
        }

        @keyframes pulseLime {
            0%, 100% { box-shadow: 0 0 15px rgba(163, 255, 18, 0.3); }
            50% { box-shadow: 0 0 30px rgba(163, 255, 18, 0.6); }
        }

        @keyframes shine {
            from { left: -100%; }
            to { left: 100%; }
        }

        @keyframes shine-slow {
            0% { transform: translateX(-100%) skewX(-15deg); }
            100% { transform: translateX(200%) skewX(-15deg); }
        }

        @keyframes pulseSlow {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; filter: brightness(1.2); }
        }

        .animate-float {
            animation: float 15s ease-in-out infinite;
        }

        .animate-float-slow {
            animation: float-slow 20s ease-in-out infinite;
        }

        .animate-orb {
            animation: floatOrb 6s ease-in-out infinite;
        }

        .animate-glow-pulse {
            animation: glowPulse 8s ease-in-out infinite;
        }

        .animate-circle-float {
            animation: circleFloat 5s ease-in-out infinite;
        }

        .animate-pulse-lime {
            animation: pulseLime 3s ease-in-out infinite;
        }

        .animate-shine {
            animation: shine 2s infinite;
        }

        .animate-shine-slow {
            animation: shine-slow 10s infinite linear;
        }

        .animate-pulse-slow {
            animation: pulseSlow 3s ease-in-out infinite;
        }

        .animate-scroll-fast {
            animation: scrollFast 40s linear infinite;
        }

        .logo-track {
            display: flex;
            width: max-content;
            animation: scrollLogos 25s linear infinite;
        }

        @media (max-width: 768px) {
            .logo-track {
                animation-duration: 40s;
            }
        }

        .logo-track:hover {
            animation-play-state: paused;
        }

        .text-gradient-brand {
            background: linear-gradient(to right, #3A7BD5, #00D2FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-gradient-lime {
            background: linear-gradient(to right, #A3FF12, #56ab2f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bg-mesh {
            background-image: 
                radial-gradient(at 0% 0%, rgba(58, 123, 213, 0.1) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.05) 0, transparent 50%);
        }

        .scroll-reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .scroll-reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .logo-marquee {
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        .vignette-overlay {
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
        }

        .font-serif-italic {
            font-family: 'Playfair Display', serif;
            font-style: italic;
        }

        /* Services Panel Custom Styles */
        .service-panel {
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            height: 80px;
            overflow: hidden;
            background: linear-gradient(135deg, #0B132B, #1C2541);
        }

        .service-panel.active-panel {
            height: 320px;
            background: linear-gradient(135deg, #101B3A, #1F2D5E);
            box-shadow: 0 0 25px rgba(0,210,255,0.25);
        }

        @media (max-width: 768px) {
            .service-panel.active-panel {
                height: 400px;
            }
        }

        .panel-image-mask {
            clip-path: inset(0 100% 0 0);
            transition: clip-path 0.7s ease-in-out, transform 0.7s ease-in-out, opacity 0.7s ease;
            transform: translateX(60px);
            opacity: 0;
        }

        .active-panel .panel-image-mask {
            clip-path: inset(0 0% 0 0);
            transform: translateX(0);
            opacity: 1;
        }

        .panel-content {
            transition: transform 0.7s ease, opacity 0.7s ease;
            transform: translateX(-30px);
            opacity: 0;
        }

        .active-panel .panel-content {
            transform: translateX(0);
            opacity: 1;
        }

        /* Project Card Tilt Perspective */
        .perspective-container {
            perspective: 1000px;
        }
        
        .tilt-card {
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        /* Footer Column Entry */
        .footer-reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .footer-reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
<body class="bg-[#0B132B] text-white overflow-x-hidden selection:bg-[#00D2FF] selection:text-[#0B132B]">
    <div id="root"></div>
</body>
</html>
